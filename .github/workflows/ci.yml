name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Contract tests
        run: npm run test:contract
      - name: Context isolation tests
        run: npm run test:isolation
      - name: Production conformance tests
        run: npm run test:conformance
      - name: Build
        run: npm run build
      - name: Validate architecture declarations
        run: |
          test -f contracts.lock.yaml
          test -f runtime/requirements.yaml
          test -f .nabhold/environment.yaml

  core-module-integration:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: baobab_trade_test
          POSTGRES_USER: baobab_trade
          POSTGRES_PASSWORD: baobab_trade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baobab_trade -d baobab_trade_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://baobab_trade:baobab_trade@localhost:5432/baobab_trade_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: gate-1-integration-jwt-secret
      COOKIE_SECRET: gate-1-integration-cookie-secret
      BAOBAB_WEBHOOK_SIGNING_SECRET: gate-1-integration-webhook-secret
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Medusa migrations
        run: npm run migrate
      - name: Verify required core modules
        run: npm run verify:core-modules
      - name: Bootstrap Uganda and South Africa Market projections
        run: npm run bootstrap:market
      - name: Verify Market projection isolation
        run: npm run verify:market-projections

      - name: Verify Gate 5 B2B module persistence
        run: npm run verify:b2b-module

      - name: Bootstrap Gate 6 ZuriBeans catalogue and pricing
        run: npm run bootstrap:catalogue

      - name: Verify Gate 6 catalogue and pricing projections
        run: npm run verify:catalogue

      - name: Bootstrap Gate 7 inventory projections
        run: npm run bootstrap:inventory

      - name: Verify Gate 7 inventory and reservations
        run: npm run verify:inventory

      - name: Bootstrap Gate 8 payment policies
        run: npm run bootstrap:payments

      - name: Verify Gate 8 payment lifecycle and ERP reconciliation
        run: npm run verify:payments

      - name: Bootstrap Gate 9 fulfilment policies
        run: npm run bootstrap:fulfilment

      - name: Verify Gate 9 fulfilment, tracking, and reconciliation
        run: npm run verify:fulfilment

      - name: Bootstrap Gate 10 tax contexts
        run: npm run bootstrap:tax

      - name: Verify Gate 10 effective tax and reconciliation
        run: npm run verify:tax

      - name: Bootstrap Gate 11 trade lanes
        run: npm run bootstrap:trade-readiness

      - name: Verify Gate 11 trade-readiness metadata
        run: npm run verify:trade-readiness

      - name: Bootstrap Gate 12 ERP mappings
        run: npm run bootstrap:erp-integration

      - name: Verify Gate 12 ERP projections and reconciliation
        run: npm run verify:erp-integration

      - name: Verify Gate 13 durable events and outbox
        run: npm run verify:event-outbox

      - name: Bootstrap Thamani B2C Uganda and South Africa Market projections
        run: npm run bootstrap:thamani-market

      - name: Verify Thamani B2C Market projection isolation
        run: npm run verify:thamani-market

      - name: Bootstrap Thamani B2C retail catalogue and suppliers
        run: npm run bootstrap:thamani-catalogue

      - name: Verify Thamani B2C catalogue and supplier projections
        run: npm run verify:thamani-catalogue

  production-infrastructure-integration:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: baobab_trade_production_test
          POSTGRES_USER: baobab_trade
          POSTGRES_PASSWORD: baobab_trade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baobab_trade -d baobab_trade_production_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: production
      DATABASE_URL: postgres://baobab_trade:baobab_trade@localhost:5432/baobab_trade_production_test
      REDIS_URL: redis://localhost:6379
      MEDUSA_FF_CACHING: true
      JWT_SECRET: gate-2-integration-jwt-secret
      COOKIE_SECRET: gate-2-integration-cookie-secret
      BAOBAB_CONTROL_PLANE_BASE_URL: http://localhost:8080
      BAOBAB_WEBHOOK_SIGNING_SECRET: gate-2-integration-webhook-secret
      S3_FILE_URL: https://assets.example.invalid/baobab-trade
      S3_REGION: auto
      S3_BUCKET: baobab-trade-test
      S3_ENDPOINT: https://s3.example.invalid
      S3_ACCESS_KEY_ID: gate-2-access-key
      S3_SECRET_ACCESS_KEY: gate-2-secret-key
      SENDGRID_API_KEY: gate-2-sendgrid-key
      SENDGRID_FROM: commerce@example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Apply Medusa migrations with production providers
        run: npm run migrate
      - name: Verify production infrastructure modules
        run: npm run verify:infrastructure
