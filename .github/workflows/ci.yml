name: CI
on:
  pull_request:
  push:
    branches: [main, work]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: baobab_trade_test
          POSTGRES_USER: baobab_trade
          POSTGRES_PASSWORD: baobab_trade
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U baobab_trade -d baobab_trade_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
