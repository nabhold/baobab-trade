name: Enforce Dependabot Config

on:
  push:
    branches: [main]
    paths:
      - ".github/dependabot.yml"
  pull_request:
    paths:
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
