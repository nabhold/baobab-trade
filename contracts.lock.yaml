schema:
  name: "nabhold-contract-consumption-lock"
  version: "1.0"
consumer:
  repository: "nabhold/baobab-trade"
  version: "0.2.0"
sources:
  shared:
    repository: "nabhold/shared"
    commit: "c518b9aa7be1e67c2b9d360c75a97123ee47382f"
    contracts:
      development_environment:
        path: "contracts/development-environment/schema.yaml"
        version: "1.0"
      tenancy:
        path: "contracts/tenancy/tenancy.yaml"
        version: "1.0"
      legal_entity_registry:
        path: "contracts/legal-entity/registry.yaml"
        version: "current-at-pinned-commit"
      control_plane_domain:
        path: "contracts/control-plane/v1/domain.schema.json"
        version: "1"
      context_resolution:
        path: "contracts/control-plane/v1/context-resolution.schema.json"
        version: "1"
      market_registry:
        path: "contracts/control-plane/v1/market.schema.json"
        version: "1"
        note: >-
          Market registry schema is published, but no Market instance exists yet for
          ZuriBeans UG or ZA: legal-entity/registry.yaml records ZURIBEANS with
          markets: []. Trade MUST resolve real market_id values from Control Plane
          (GET /v1/markets/{market_id}) once activated, not mint them locally.
      canonical_mapping:
        path: "contracts/control-plane/v1/canonical-mapping.schema.json"
        version: "1"
      control_plane_openapi:
        path: "contracts/control-plane/v1/openapi.yaml"
        version: "1.1.0"
      problem_details:
        path: "contracts/errors/v1/problem-details.schema.json"
        version: "1"
      idempotency_policy:
        path: "contracts/idempotency/v1/policy.yaml"
        version: "1.0"
      event_envelope:
        path: "contracts/events/v1/envelope.schema.json"
        version: "1"
  control_plane:
    repository: "nabhold/baobab-cp"
    role: "authoritative runtime provider of authenticated tenant context, market registry and product entitlement"
    api_contract_status: "published-in-nabhold/shared"
    context_resolution_endpoint: "POST /v1/context/resolve"
    market_endpoint: "GET /v1/markets/{market_id}"
  event_envelope:
    owner: "nabhold/shared"
    publication_status: "published"
    format: "CloudEvents 1.0 structured JSON profile (contracts/events/v1/envelope.schema.json)"
policy:
  fail_on_unresolved_tenant_context: true
  allow_cross_engine_database_access: false
  allow_local_redefinition_as_canonical: false
